  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;first-dragon-journey&#x27;);
      if (!root || root.dataset.ready === &#x27;true&#x27;) return;
      root.dataset.ready = &#x27;true&#x27;;

      const state = { mirrorHand: 0, compass: &#x27;&#x27;, hand: &#x27;&#x27;, dragon: &#x27;&#x27;, alternate: &#x27;&#x27;, stone: &#x27;&#x27; };
      const screens = Array.from(root.querySelectorAll(&#x27;[data-screen]&#x27;));
      const stages = Array.from(root.querySelectorAll(&#x27;[data-stage]&#x27;));

      function stageFor(screen) {
        if (screen &lt;= 3) return 0;
        if (screen === 4) return 1;
        if (screen === 5) return 2;
        if (screen &lt;= 7) return 3;
        return 4;
      }

      function show(screen) {
        screens.forEach((panel) =&gt; { panel.hidden = Number(panel.dataset.screen) !== screen; });
        const activeStage = stageFor(screen);
        stages.forEach((stage) =&gt; { stage.classList.toggle(&#x27;is-current&#x27;, Number(stage.dataset.stage) === activeStage); });

        if (screen === 3) {
          root.querySelector(&#x27;[data-mirror-result]&#x27;).textContent = state.mirrorHand &gt;= 2
            ? &#x27;В этих сценах ты чаще начинал с шага, а направление уточнял по дороге.&#x27;
            : &#x27;В этих сценах ты чаще сначала искал направление, а затем был готов делать шаг.&#x27;;
        }
        if (screen === 6) {
          const clearAction = state.hand.includes(&#x27;прояснить&#x27;) || state.hand.includes(&#x27;важна&#x27;);
          root.querySelector(&#x27;[data-gap-result]&#x27;).textContent = clearAction
            ? `Твоя Рука уже пытается двигаться к направлению «${state.compass}» через ясность.`
            : `Ты хочешь отношений «${state.compass.toLowerCase()}», но выбранная реакция может оставить важное непрояснённым.`;
        }
        if (screen === 7) root.querySelector(&#x27;[data-dragon-echo]&#x27;).textContent = `Дракон говорит: «${state.dragon}».`;
        if (screen === 9) {
          Object.keys(state).forEach((key) =&gt; {
            const target = root.querySelector(`[data-summary=&quot;${key}&quot;]`);
            if (target) target.textContent = state[key];
          });
        }
      }

      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const control = event.target.closest(&#x27;button&#x27;);
        if (!control || !root.contains(control)) return;

        if (control.dataset.mirror) state.mirrorHand += control.dataset.mirror === &#x27;hand&#x27; ? 1 : 0;
        if (control.dataset.compass) state.compass = control.dataset.compass;
        if (control.dataset.hand) state.hand = control.dataset.hand;
        if (control.dataset.dragon) state.dragon = control.dataset.dragon;
        if (control.dataset.alternate) state.alternate = control.dataset.alternate;

        if (control.hasAttribute(&#x27;data-accept-stone&#x27;)) {
          const value = root.querySelector(&#x27;#first-dragon-stone&#x27;).value.trim();
          state.stone = value || &#x27;Я пока не нашёл точную формулировку своего открытия.&#x27;;
        }
        if (control.hasAttribute(&#x27;data-reject-stone&#x27;)) state.stone = &#x27;Эта гипотеза не подтвердилась. Мне нужно другое объяснение реакции.&#x27;;

        if (control.hasAttribute(&#x27;data-restart&#x27;)) {
          state.mirrorHand = 0;
          state.compass = &#x27;&#x27;;
          state.hand = &#x27;&#x27;;
          state.dragon = &#x27;&#x27;;
          state.alternate = &#x27;&#x27;;
          state.stone = &#x27;&#x27;;
          show(0);
          return;
        }

        if (control.dataset.next) show(Number(control.dataset.next));
      });
    })();
  &lt;/script&gt;
