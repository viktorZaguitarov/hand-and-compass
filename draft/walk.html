<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hand & Compass — прогулка</title>
  <style>
    :root { --cream:#f2e5c9; --paper:#f8edd6; --ink:#2d2924; --gold:#d7ac5a; --gold-soft:#876b36; --night:#0e1820; --night-2:#17242c; --rust:#9c5b3c; }
    * { box-sizing:border-box } body { margin:0; min-width:320px; color:var(--ink); background:var(--cream); font:16px/1.35 ui-serif, Georgia, serif; }
    button, textarea, select { font:inherit } button { cursor:pointer } button:focus-visible, textarea:focus-visible, select:focus-visible { outline:3px solid #e5b858; outline-offset:3px }
    .app { min-height:100dvh; display:grid; grid-template-rows:auto 1fr; overflow:hidden; background:var(--cream); }
    header { z-index:10; display:flex; align-items:center; gap:12px; min-height:56px; padding:10px clamp(14px,3vw,36px); border-bottom:1px solid #b89c6c; background:linear-gradient(110deg,#f9efd9,#e8d5b3); box-shadow:0 2px 14px #50391a22; }
    header h1 { margin:0; font-size:clamp(19px,2.5vw,30px); font-weight:500 } .demo { font-size:12px; color:#705d42; } .head-actions { margin-left:auto; display:flex; gap:8px; }
    .small { border:1px solid #8b7049; border-radius:8px; padding:7px 10px; color:#493823; background:#f8edda; font-size:13px; } .small:hover { background:#fff7e7 }
    #map { position:relative; overflow:hidden; min-height:0; touch-action:none; background:radial-gradient(ellipse at 45% 42%,#283740 0,#17252d 38%,#0d171e 100%); }
    #map::before { content:""; position:absolute; inset:-20%; opacity:.45; pointer-events:none; background-image:radial-gradient(#d9bf7b66 1px,transparent 1.8px), repeating-radial-gradient(ellipse at 40% 30%,transparent 0 16px,#72909911 17px 20px); background-size:79px 61px,110px 96px; filter:blur(.2px); }
    #world { position:absolute; width:1120px; height:800px; transform-origin:0 0; will-change:transform; }
    .mist { position:absolute; border-radius:50%; filter:blur(24px); opacity:.14; background:#b8c7bd; pointer-events:none; } .mist.a{width:360px;height:130px;left:100px;top:210px}.mist.b{width:420px;height:150px;right:80px;bottom:100px}
    svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; } .path { fill:none; stroke:#7c775e; stroke-width:2; opacity:.6; stroke-dasharray:3 12; } .route { fill:none; stroke:var(--gold); stroke-width:4; stroke-linecap:round; filter:drop-shadow(0 0 5px #e5b758); }
    .island { position:absolute; min-width:124px; min-height:66px; padding:16px 14px 13px; border:0; border-radius:48% 52% 42% 58% / 50% 41% 59% 50%; color:#f8e6bd; text-shadow:0 2px 2px #000; background:radial-gradient(ellipse at 48% 27%,#9e8c52 0 4%,#68643d 18%,#333c2d 51%,#172027 74%,transparent 75%); box-shadow:0 14px 12px #020609aa,inset 0 2px 4px #d1bc7b44; transition:filter .2s, transform .2s; }
    .island::after { content:""; position:absolute; left:18%; bottom:-10px; width:64%; height:14px; border-radius:50%; background:#070b0e99; filter:blur(5px); z-index:-1; } .island:hover,.island:focus-visible,.island.active { filter:brightness(1.25); transform:translateY(-3px) } .island strong { display:block; font-size:18px; font-weight:500 } .island span { display:block; margin-top:2px; font:11px/1.1 ui-sans-serif,system-ui; color:#dacb9b; }
    .island.proposed { border:2px dashed #d3a653; background:transparent; box-shadow:none; color:#e7c983; } .island.proposed span{color:#d4b574}.island .mark { position:absolute; right:12px; top:8px; color:#f6c769; font:18px Georgia,serif; }
    .tip { position:absolute; left:18px; top:18px; z-index:3; max-width:220px; padding:13px 35px 13px 14px; border:1px solid #b99563; border-radius:5px 14px 10px 16px; background:#ead5ab; box-shadow:0 9px 18px #0005; } .tip button { position:absolute; right:8px; top:6px; border:0; background:transparent; font-size:20px; color:#60482f; }
    .map-controls { position:absolute; right:14px; bottom:15px; z-index:3; display:grid; gap:6px; } .map-controls button { width:42px;height:38px;border:1px solid #b9945b;border-radius:9px;background:#f5e5c4;color:#3e3023;font-size:20px;box-shadow:0 3px 8px #0004; }
    .card, .panel { position:absolute; z-index:6; width:min(410px,calc(100% - 24px)); max-height:calc(100dvh - 86px); overflow:auto; padding:20px; border:1px solid #b8955b; border-radius:15px 7px 17px 9px; background:linear-gradient(125deg,#fff4da,#e9d4a8); box-shadow:0 15px 38px #0008; } .card { right:14px; bottom:14px; } .panel { inset:72px 14px auto auto; }
    .card h2,.panel h2 { margin:0 28px 5px 0; font-size:28px; font-weight:500 } .card p { margin:7px 0; color:#5d4a36 } .close { position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:25px;color:#5c452d; }
    .neighbors { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0; } .chip { border:1px solid #a98251;border-radius:999px;background:#f6e7c6;padding:7px 10px;color:#4e3925;font-size:14px; }
    .primary,.secondary { width:100%; min-height:45px; margin-top:8px; border-radius:9px; padding:10px 13px; } .primary { border:1px solid #6f3c27;background:linear-gradient(#ad704d,#82472f);color:#fff3d9;box-shadow:inset 0 1px #e4b184; } .secondary { border:1px solid #9f835b;background:#f9eccf;color:#443524; }
    .modal-wrap { position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:16px;background:#071017aa; } .modal { width:min(460px,100%); max-height:calc(100dvh - 32px); overflow:auto; padding:22px; border:1px solid #c2a56d;border-radius:15px;background:linear-gradient(135deg,#fff4dc,#ead5ae);box-shadow:0 20px 55px #000b; } .modal h2{margin:0 0 7px;font-size:30px;font-weight:500}.modal p{margin:8px 0;color:#54412f}.modal label{display:block;margin-top:14px;font-size:14px;color:#66513a}.modal textarea,.modal select{width:100%;margin-top:6px;padding:10px;border:1px solid #a58659;border-radius:8px;background:#fff7e7;color:#30271f;min-height:116px;resize:vertical}.modal select{min-height:42px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.why{margin:12px 0;padding:11px;border-top:1px solid #c7a977;border-bottom:1px solid #c7a977;font-style:italic}.note{padding:10px;margin:10px 0;border-left:3px solid var(--rust);background:#f5e2bc}.meta{font:12px ui-sans-serif,system-ui;color:#796146}.empty{color:#735e47;font-style:italic}
    .toast{position:fixed;z-index:30;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 15px;border-radius:99px;background:#f5e4bd;color:#463521;box-shadow:0 5px 17px #0008}.hidden{display:none!important}
    @media (max-width:520px){ header{min-height:52px}.head-actions{gap:4px}.head-actions .small{padding:6px 7px;font-size:11px}.card{left:12px;right:12px;bottom:10px;width:auto;padding:16px}.card h2{font-size:25px}.panel{left:10px;right:10px;width:auto}.tip{font-size:14px;max-width:205px}.island strong{font-size:16px} }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header><h1>Моя прогулка</h1><span class="demo">Демонстрационная карта</span><div class="head-actions"><button class="small" id="notesButton">Мои записи</button><button class="small" id="resetButton">Сбросить эскиз</button></div></header>
  <main id="map" aria-label="Демонстрационная карта слов">
    <div id="world"><div class="mist a"></div><div class="mist b"></div><svg id="lines" viewBox="0 0 1120 800"></svg><div id="islands"></div></div>
    <aside class="tip" id="tip">Куда тебе хочется? Нажми на слово.<button aria-label="Закрыть подсказку">×</button></aside>
    <div class="map-controls" aria-label="Масштаб карты"><button id="zoomIn" aria-label="Приблизить">+</button><button id="zoomOut" aria-label="Отдалить">−</button><button id="home" aria-label="К началу карты">⌂</button></div>
  </main>
</div>
<div id="cardHost"></div><div id="modalHost"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
  'use strict';
  const KEYS={view:'hnc_walk_view_v1',records:'hnc_walk_records_v1',added:'hnc_walk_added_v1',route:'hnc_walk_route_v1',tip:'hnc_walk_tip_v1'};
  const base=[
    {id:'svoboda',name:'свобода',x:220,y:180,q:'Где тебе сейчас хочется больше воздуха?',neighbors:['own_time','spontaneity','granicy']},
    {id:'own_time',name:'своё время',x:460,y:340,q:'Что делает время твоим?',neighbors:['svoboda','uyut','zabota'],story:true},
    {id:'spontaneity',name:'спонтанность',x:765,y:250,q:'Где можно не знать всё заранее?',neighbors:['svoboda','lyubopytstvo']},
    {id:'uyut',name:'уют',x:300,y:545,q:'Что помогает тебе выдохнуть?',neighbors:['own_time','muzyka']},
    {id:'muzyka',name:'музыка',x:700,y:520,q:'Какая музыка возвращает тебя к себе?',neighbors:['uyut','lyubopytstvo']},
    {id:'lyubopytstvo',name:'любопытство',x:920,y:165,q:'К чему хочется подойти без обязательства?',neighbors:['spontaneity','muzyka']},
    {id:'zabota',name:'забота',x:705,y:390,q:'Как для тебя выглядит быть рядом?',neighbors:['own_time','granicy']},
    {id:'granicy',name:'границы',x:955,y:590,q:'Что ты хочешь оставить неприкосновенным?',neighbors:['svoboda','zabota']},
    {id:'pause',name:'пауза',x:105,y:390,q:'Где тебе можно не решать сразу?',neighbors:['own_time'],proposed:true}
  ];
  const $=s=>document.querySelector(s), el=(tag,attrs={},text='')=>{const n=document.createElement(tag);Object.assign(n,attrs);if(text)n.textContent=text;return n};
  const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}, write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
  let view=read(KEYS.view,{x:0,y:0,scale:1}), route=read(KEYS.route,[]), records=read(KEYS.records,[]), added=read(KEYS.added,[]), selected=null, drag=null, pointers=new Map(), suppressClick=false;
  const words=()=>[...base.filter(w=>!added.some(a=>a.id===w.id)),...added];
  const map=$('#map'),world=$('#world'),islands=$('#islands'),lines=$('#lines'),cardHost=$('#cardHost'),modalHost=$('#modalHost');
  function word(id){return words().find(w=>w.id===id)} function hasRecord(id){return records.some(r=>r.wordId===id)}
  function save(){return write(KEYS.view,view)&&write(KEYS.route,route)&&write(KEYS.records,records)&&write(KEYS.added,added)}
  function transform(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`}
  function fit(){const r=map.getBoundingClientRect();view={scale:Math.max(.65,Math.min(1,r.width/760)),x:Math.max(12,(r.width-1120*Math.max(.65,Math.min(1,r.width/760)))/2),y:Math.max(0,(r.height-800*Math.max(.65,Math.min(1,r.width/760)))/2)};save();transform()}
  function path(a,b,cls='path'){return `<path class="${cls}" d="M ${a.x+62} ${a.y+32} Q ${(a.x+b.x)/2} ${Math.min(a.y,b.y)-60} ${b.x+62} ${b.y+32}"/>`}
  function renderMap(){islands.replaceChildren();const ws=words();let svg='';ws.forEach(w=>w.neighbors.filter(n=>w.id<n).forEach(n=>{const b=word(n);if(b)svg+=path(w,b)}));for(let i=1;i<route.length;i++){const a=word(route[i-1]),b=word(route[i]);if(a&&b)svg+=path(a,b,'route')}lines.innerHTML=svg;ws.forEach(w=>{const b=el('button',{className:`island${w.proposed?' proposed':''}${selected===w.id?' active':''}`,type:'button'});b.style.left=w.x+'px';b.style.top=w.y+'px';b.dataset.id=w.id;b.append(el('strong',{},w.name),el('span',{},w.proposed?'Можно добавить':'демонстрационное слово'));if(hasRecord(w.id))b.append(el('i',{className:'mark','aria-label':'Есть запись'},'✦'));islands.append(b)});transform()}
  function toast(text){const n=$('#toast');n.textContent=text;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3200)}
  function closeCard(){selected=null;cardHost.replaceChildren();renderMap()}
  function openWord(id,fromNeighbor=false){const w=word(id);if(!w)return;selected=id;if(fromNeighbor){route=[...route,id].filter((v,i,a)=>i===0||v!==a[i-1]);save()}renderMap();const card=el('article',{className:'card'});card.append(el('button',{className:'close',ariaLabel:'Закрыть карточку'},'×'),el('h2',{},w.name),el('p',{},w.q));const notes=records.filter(r=>r.wordId===id);if(notes.length){const n=el('button',{className:'note',type:'button'},`✦ ${notes.length===1?'Есть одна запись':'Записей: '+notes.length}`);n.onclick=()=>showRecords(id);card.append(n)}const ns=el('div',{className:'neighbors'});w.neighbors.map(word).filter(Boolean).forEach(n=>{const b=el('button',{className:'chip',type:'button'},n.name);b.onclick=()=>openWord(n.id,true);ns.append(b)});card.append(ns);if(w.proposed){const b=el('button',{className:'primary',type:'button'},'Добавить на карту');b.onclick=()=>{added=[...added,{...w,proposed:false}];if(save()){openWord(w.id);toast('«'+w.name+'» добавлено только в эту демонстрационную карту.')}else toast('Браузер не дал сохранить добавление.')};card.append(b)}if(w.story) {const b=el('button',{className:'primary',type:'button'},'Открыть историю');b.onclick=openStory;card.append(b)}cardHost.replaceChildren(card);card.querySelector('.close').onclick=closeCard}
  function modal(title,body){modalHost.replaceChildren();const wrap=el('div',{className:'modal-wrap'}),m=el('section',{className:'modal',role:'dialog',ariaModal:'true'});m.append(el('button',{className:'close',ariaLabel:'Закрыть'},'×'),el('h2',{},title));if(typeof body==='string')m.append(el('p',{},body));else m.append(body);wrap.append(m);modalHost.append(wrap);m.querySelector('.close').onclick=closeModal;return m} function closeModal(){modalHost.replaceChildren()}
  function openStory(){closeCard();const d=el('div');d.append(el('p',{},'Ты оставил вечер свободным. Друг просит помочь. Ты можешь, но не хочешь.'),el('p',{},'Как поступишь ты?'));const actions=[['Помогу сегодня','help'],['Предложу другой день','other'],['Свой вариант','own'],['Пропустить','skip']];actions.forEach(([t,v])=>{const b=el('button',{className:v==='skip'?'secondary':'primary',type:'button'},t);b.onclick=()=>v==='own'?ownChoice():v==='skip'?(closeModal(),toast('История закрыта без вывода.')):reply(v);d.append(b)});modal('Свободный вечер',d)}
  function ownChoice(){const d=el('div');d.append(el('p',{},'Можно написать свой вариант. Он не будет истолкован автоматически.'));const t=el('textarea',{placeholder:'Как поступишь ты?'});const b=el('button',{className:'primary',type:'button'},'Продолжить');b.onclick=()=>{if(!t.value.trim()){t.focus();return}reply('own')};d.append(t,b);modal('Свой вариант',d)}
  function reply(choice){const d=el('div');d.append(el('p',{className:'meta'},choice==='own'?'Ты выбрал свой вариант.':'Ты сделал выбор.'),el('p',{className:'meta'},'Вымышленный собеседник'),el('p',{},'Я бы помог сегодня. Для меня забота — быть рядом, когда нужен.'));const why=el('div',{className:'why hidden'},'Свой вечер придётся перенести, и мне было бы жаль. Если бы я уже обещал это время другому человеку, я бы предложил помочь позже.');const wb=el('button',{className:'secondary',type:'button'},'Почему так?');wb.onclick=()=>why.classList.toggle('hidden');const row=el('div',{className:'row'}),think=el('button',{className:'secondary',type:'button'},'Оставить свою мысль'),end=el('button',{className:'secondary',type:'button'},'Закончить');think.onclick=writeThought;end.onclick=()=>{closeModal();toast('История закончена. Можно просто гулять дальше.')};row.append(think,end);d.append(wb,why,row);modal('Ответ двойника',d)}
  function writeThought(){const d=el('div');d.append(el('p',{},'Что хочется оставить после этой истории?'));const t=el('textarea',{placeholder:'Здесь только твои слова.'});const select=el('select');select.append(el('option',{value:'own_time'},'Сохранить у «своё время»'));words().filter(w=>w.id!=='own_time').forEach(w=>select.append(el('option',{value:w.id},'Сохранить у «'+w.name+'»')));select.append(el('option',{value:''},'Сохранить только у истории'));const saveButton=el('button',{className:'primary',type:'button'},'Сохранить');const no=el('button',{className:'secondary',type:'button'},'Не сохранять');saveButton.onclick=()=>{const text=t.value.trim();if(!text){t.focus();return}const r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,wordId:select.value||null,createdAt:new Date().toISOString(),context:'Из истории «Свободный вечер»'};records.push(r);if(!save()){records.pop();toast('Браузер не дал сохранить запись.');return}closeModal();if(r.wordId){route=[...route,r.wordId];save();openWord(r.wordId);toast('Сохранено у «'+word(r.wordId).name+'».')}else toast('Сохранено у истории. Найти можно в «Моих записях».')};no.onclick=()=>{closeModal();toast('Мысль не сохранена.')};d.append(t,el('label',{},'Где оставить мысль?'),select,saveButton,no);modal('Твоя мысль',d)}
  function date(v){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v))}
  function showRecords(filter=null){const list=filter?records.filter(r=>r.wordId===filter):records;const d=el('div');if(!list.length)d.append(el('p',{className:'empty'},'Здесь пока нет записей.'));list.slice().reverse().forEach(r=>{const box=el('div',{className:'note'}),text=el('p',{},r.text),meta=el('p',{className:'meta'},`${r.context} · ${date(r.createdAt)}`),row=el('div',{className:'row'}),edit=el('button',{className:'small',type:'button'},'Изменить'),del=el('button',{className:'small',type:'button'},'Удалить');edit.onclick=()=>editRecord(r.id);del.onclick=()=>{records=records.filter(x=>x.id!==r.id);save();showRecords(filter)};row.append(edit,del);box.append(text,meta,row);d.append(box)});modal(filter?'Записи у «'+word(filter).name+'»':'Мои записи',d)}
  function editRecord(id){const r=records.find(x=>x.id===id),d=el('div'),t=el('textarea');t.value=r.text;const b=el('button',{className:'primary',type:'button'},'Сохранить изменения');b.onclick=()=>{if(!t.value.trim())return;t.blur();r.text=t.value.trim();if(save()){closeModal();showRecords(r.wordId)}else toast('Изменения не удалось сохранить.')};d.append(t,b);modal('Изменить запись',d)}
  function zoom(delta,anchor){const old=view.scale,next=Math.max(.55,Math.min(1.65,old+delta));const r=map.getBoundingClientRect(),p=anchor||{x:r.width/2,y:r.height/2};view.x=p.x-(p.x-view.x)*next/old;view.y=p.y-(p.y-view.y)*next/old;view.scale=next;save();transform()}
  islands.addEventListener('click',e=>{if(suppressClick)return;const b=e.target.closest('.island');if(b)openWord(b.dataset.id)});
  map.addEventListener('pointerdown',e=>{if(e.target.closest('button,.card,.modal'))return;map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};});
  map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()];const before=Math.hypot(prev.x-p[0].x,prev.y-p[0].y)||1,after=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1;zoom((after/before-1)*view.scale,{x:(p[0].x+p[1].x)/2-map.getBoundingClientRect().left,y:(p[0].y+p[1].y)/2-map.getBoundingClientRect().top});drag.moved=true;return}if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;transform()}});
  map.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(drag?.moved){suppressClick=true;setTimeout(()=>suppressClick=false,0);save()}drag=null});map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();zoom(e.deltaY>0?-.08:.08,{x:e.clientX-r.left,y:e.clientY-r.top})},{passive:false});
  $('#zoomIn').onclick=()=>zoom(.12);$('#zoomOut').onclick=()=>zoom(-.12);$('#home').onclick=fit;$('#tip button').onclick=()=>{write(KEYS.tip,true);$('#tip').classList.add('hidden')};if(read(KEYS.tip,false))$('#tip').classList.add('hidden');$('#notesButton').onclick=()=>showRecords();$('#resetButton').onclick=()=>{if(confirm('Сбросить только эскиз прогулки и все его записи? Основная карта не затронется.')){Object.values(KEYS).forEach(k=>localStorage.removeItem(k));view={x:0,y:0,scale:1};route=[];records=[];added=[];selected=null;closeCard();fit();toast('Эскиз прогулки сброшен.')}};
  fit();renderMap();
})();
</script>
</body></html>
